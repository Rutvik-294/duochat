<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoChat (Google Drive)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;background:#f5f5f7;color:#1a1a1a;display:flex;flex-direction:column;height:100vh;}
  #signin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  header{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e5ea;font-weight:600;display:flex;justify-content:space-between;}
  #messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;}
  .row.me{justify-content:flex-end;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap;word-wrap:break-word;}
  .me .bubble{background:#0a84ff;color:#fff;}
  .them .bubble{background:#e9e9eb;color:#1a1a1a;}
  .meta{font-size:10px;color:#8a8a8e;padding:2px 6px;}
  #inputbar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e5e5ea;}
  #msgInput{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #e5e5ea;font-size:15px;}
  #sendBtn{padding:10px 18px;border-radius:20px;border:none;background:#0a84ff;color:#fff;cursor:pointer;}
  #chatApp{display:none;flex-direction:column;height:100%;}
</style>
</head>
<body>

<div id="signin">
  <h2>DuoChat</h2>
  <p>Sign in with the Google account that has access to the shared file.</p>
  <div id="gsiBtn"></div>
</div>

<div id="chatApp">
  <header><span>DuoChat</span><span id="whoami"></span></header>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="msgInput" placeholder="Type a message…" autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
// ====== CONFIGURE THESE TWO ======
const CLIENT_ID = "700593681149-5u5v6vhh3bd7rsctjen480c2dghep5lc.apps.googleusercontent.com";
const FILE_ID    = "1XACWDKwUowtNUu6fJLCnPjM15Ny872Fe";
// ==================================

const SCOPE = "https://www.googleapis.com/auth/drive";
let accessToken = null;
let myEmail = null;
let tokenClient;
let pollTimer;

window.onload = () => {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      accessToken = resp.access_token;
      fetchProfile();
    }
  });

  const btn = document.createElement("button");
  btn.textContent = "Sign in with Google";
  btn.style.cssText = "padding:12px 24px;border-radius:12px;border:none;background:#0a84ff;color:#fff;font-size:16px;cursor:pointer;";
  btn.onclick = () => tokenClient.requestAccessToken();
  document.getElementById("gsiBtn").appendChild(btn);
};

async function fetchProfile(){
  const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
    headers: { Authorization: "Bearer " + accessToken }
  });
  const data = await res.json();
  myEmail = data.email;
  document.getElementById("signin").style.display = "none";
  document.getElementById("chatApp").style.display = "flex";
  document.getElementById("whoami").textContent = myEmail;
  loadMessages();
  pollTimer = setInterval(loadMessages, 3000);
}

async function driveGet(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media`, {
    headers: { Authorization: "Bearer " + accessToken }
  });
  if (!res.ok) throw new Error("Drive read failed: " + res.status);
  const text = await res.text();
  return text.trim() ? JSON.parse(text) : [];
}

async function driveSet(list){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${FILE_ID}?uploadType=media`, {
    method: "PATCH",
    headers: {
      Authorization: "Bearer " + accessToken,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(list)
  });
}

let lastCount = -1;
async function loadMessages(){
  try {
    const list = await driveGet();
    if (list.length === lastCount) return;
    lastCount = list.length;
    render(list);
  } catch(e){ console.error(e); }
}

function render(list){
  const el = document.getElementById("messages");
  el.innerHTML = list.map(m => {
    const mine = m.sender === myEmail;
    const time = new Date(m.ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const safe = m.text.replace(/</g, "&lt;");
    return `<div class="row ${mine ? "me" : "them"}">
      <div><div class="bubble">${safe}</div><div class="meta">${mine ? "You" : m.sender.split("@")[0]} · ${time}</div></div>
    </div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

async function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    const list = await driveGet();
    list.push({ sender: myEmail, text, ts: Date.now() });
    await driveSet(list);
    lastCount = list.length;
    render(list);
  } catch(e){ alert("Send failed: " + e.message); }
}
</script>
</body>
</html>
