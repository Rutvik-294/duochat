<style>

.ro{position:absolute;left:0;right:0;bottom:0;padding:70px 14px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}

.ra{display:flex;flex-direction:column;gap:10px;align-items:center}.ra button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;cursor:pointer;font-size:12px;line-height:1.1}
.rtop{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.rtop>*{pointer-events:auto}
.rtop .back{display:none}
.rs{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:34px;pointer-events:none;opacity:.8}
#app.rm{max-width:none}#app.rm .side{display:none}#app.rm .rtop .back{display:grid}
@media(max-width:760px){#app{padding:8px;gap:0}.side{width:100%}.main{display:none}#app.op .side{display:none}#app.op .main{display:flex}.back,.rtop .back{display:grid}#rf{border-radius:22px}}

.srch,.tabs{display:none!important}
.rail{width:64px;flex:none;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 0}
.nv{width:46px;height:46px;border-radius:50%;background:none;border:0;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--tx);padding:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.nv:hover{transform:scale(1.12)}
.nv.on{background:linear-gradient(135deg,var(--me1),var(--me2));color:#fff;box-shadow:0 6px 18px rgba(30,110,255,.4)}
.nv .bg{position:absolute;top:0;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#ff2d46;color:#fff;font:700 11px/1 -apple-system,system-ui,sans-serif;font-style:normal;display:none;place-items:center;padding:0 5px}
.rail #pf{width:44px;height:44px;margin-top:4px}
.side>.pbtn{align-self:stretch}
@media(max-width:760px){.side{width:auto;flex:1;min-width:0}#app{gap:6px}.rail{width:54px}.nv{width:42px;height:42px}}
</style></head>

 ac.append(no,ok);s.append(E('h3',0,'New group'),n,ul,ac);o.append(s);o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o);n.focus()};
function setup(){let id,name;try{id=localStorage.gm_id=localStorage.gm_id||'u'+Math.random().toString(36).slice(2,10);name=localStorage.gm_name}catch(e){id='u'+Math.random().toString(36).slice(2,10)}
 me.id=id;const start=()=>{me.name=name;connect()};if(name){start();return}
 const o=E('div','mod'),s=E('div','sheet glass'),n=E('input','f'),ok=E('button','pbtn','Start chatting');
 n.placeholder='Pick a username';n.maxLength=20;n.style.borderBottom='1px solid var(--bd)';
 const go2=()=>{const v=n.value.trim();if(!v)return;name=v;try{localStorage.gm_name=v}catch(e){}o.remove();start()};
 ok.onclick=go2;n.onkeydown=e=>{if(e.key==='Enter')go2()};
 s.append(E('h3',0,'Welcome 👋'),E('div','l','Choose the name your friends will see.'),n,ok);o.append(s);document.body.append(o);n.focus()}
function connect(){
 if(!window.firebase||String(FIREBASE_CONFIG.apiKey).startsWith('PASTE')){$('#chats').textContent='Setup needed: paste your Firebase config at the top of this file.';return}
 try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){$('#chats').textContent='Firebase error: '+e.message;return}
 const beat=()=>{if(!document.hidden)db.collection('users').doc(me.id).set({name:me.name,seen:now()},{merge:true}).catch(()=>{})};beat();setInterval(beat,45000);setInterval(side,30000);
 const er=e=>{$('#chats').textContent='Database error: '+e.message};
 db.collection('users').onSnapshot(s=>{U={};s.docs.forEach(x=>U[x.id]=x.data());U[me.id]=Object.assign({name:me.name,seen:now()},U[me.id]);refresh()},er);
 db.collection('chats').onSnapshot(s=>{G=s.docs.map(x=>Object.assign({id:x.id},x.data()));refresh()},er);
 db.collection('reads').onSnapshot(s=>{Rd={};s.docs.forEach(x=>Rd[x.id]=x.data());refresh()},er);
 db.collection('reels').orderBy('ts','desc').limit(30).onSnapshot(s=>{R=s.docs.map(x=>Object.assign({id:x.id},x.data()));rf()},er);
 db.collection('messages').orderBy('ts','desc').limit(500).onSnapshot(s=>{M=s.docs.map(x=>Object.assign({id:x.id},x.data())).filter(m=>m.chat&&typeof m.text==='string').reverse();refresh();markRead()},er)}
refresh();setup();
</script>
<script>
/* ===== left rail + accounts search + instants ===== */
(()=>{
const S=p=>'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const ic={
 home:S('<path d="M4 11.5 12 4l8 7.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19z" fill="currentColor"/>'),
 search:S('<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>'),
 reels:S('<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 8.5v7l5.5-3.5z"/>'),
 msg:S('<path d="M21 4 3 11l7 3 3 7z"/><path d="M10 14 21 4"/>'),
 inst:S('<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".7" fill="currentColor"/>'),
 plus:S('<path d="M12 5v14M5 12h14"/>')
};
const rail=E('nav','rail glass');
const mk=(k,t)=>{const b=E('button','nv');b.title=t;b.innerHTML=ic[k]+'<i class="bg"></i>';rail.append(b);return b};
const bH=mk('home','Chats'),bS=mk('search','Search accounts'),bR=mk('reels','Reels'),bM=mk('msg','Unread chats'),bI=mk('inst','Instants'),bP=mk('plus','Add reel');
rail.append($('#pf'));$('#app').prepend(rail);

let vw='home',unr=false,IN=[];
const hdt=$('.top h2');
const sq=E('div','glass');sq.style.cssText='display:none;align-items:center;gap:8px;border-radius:999px;padding:4px 16px;flex:none';
const si=E('input','f');si.placeholder='Search accounts';si.oninput=()=>side();sq.append(E('span',0,'🔍'),si);
$('.side').insertBefore(sq,$('#chats'));

const setBg=(b,n)=>{const g=b.querySelector('.bg');g.textContent=n>9?'9+':n;g.style.display=n?'grid':'none'};
function hl(){const r=mode==='reels';
 bH.classList.toggle('on',!r&&vw==='home'&&!unr);bS.classList.toggle('on',!r&&vw==='search');bR.classList.toggle('on',r);
 bM.classList.toggle('on',!r&&vw==='home'&&unr);bI.classList.toggle('on',!r&&vw==='inst');
 hdt.textContent=vw==='search'?'Search':vw==='inst'?'Instants':'Messenger';sq.style.display=vw==='search'?'flex':'none'}
const sm=setMode;setMode=m=>{sm(m);hl()};
function nav(v,u){vw=v;unr=!!u;if(v!=='search')si.value='';$('#app').classList.remove('op');if(mode!=='chat')setMode('chat');else refresh();hl();if(v==='search')si.focus()}
bH.onclick=()=>nav('home');bS.onclick=()=>nav('search');bM.onclick=()=>nav('home',!unr);bI.onclick=()=>nav('inst');
bR.onclick=()=>setMode('reels');bP.onclick=()=>{if(db)$('#rvf').click()};

/* accounts-only search */
function rs(){const box=$('#chats'),q=si.value.trim().toLowerCase();box.textContent='';
 const ids=[CL,...Object.keys(U).filter(i=>i!==me.id)].filter(i=>nm(i).toLowerCase().includes(q));
 if(!ids.length){box.append(E('div','l','No accounts found'));return}
 ids.forEach(i=>{const r=E('div','ch glass'),a=av(i),mid=E('div','mid');if(online(i))a.classList.add('on');
  mid.append(E('div','n',nm(i)),E('div','l',i===CL?'AI friend':online(i)?'online':'offline'));r.append(a,mid);r.onclick=()=>open(dm(me.id,i));box.append(r)})}

/* instants: one-time-view photos */
const seenBy=x=>(x.seen||{})[me.id];
const unseen=()=>IN.filter(x=>(x.to||[]).includes(me.id)&&!seenBy(x)&&x.img);
function ri(){const box=$('#chats');box.textContent='';
 const b=E('button','pbtn','＋ Send an instant');b.onclick=sendInst;box.append(b);
 const u=unseen(),sent=IN.filter(x=>x.uid===me.id);
 box.append(E('div','sec','For you'));
 if(!u.length)box.append(E('div','l','No new instants'));
 u.forEach(x=>{const r=E('div','ch glass'),mid=E('div','mid');mid.append(E('div','n',nm(x.uid)),E('div','l','Tap to view · one time only'));
  r.append(av(x.uid),mid,E('div','tm',fmt(x.ts)));r.onclick=()=>viewInst(x);box.append(r)});
 box.append(E('div','sec','Sent'));
 if(!sent.length)box.append(E('div','l','Nothing sent yet'));
 sent.forEach(x=>{const op=(x.to||[]).filter(t=>(x.seen||{})[t]),r=E('div','ch glass'),mid=E('div','mid');
  mid.append(E('div','n','To '+(x.to||[]).map(nm).join(', ')),E('div','l',op.length?'Opened by '+op.map(nm).join(', '):'Not opened yet'));
  r.append(av(x.uid),mid,E('div','tm',fmt(x.ts)));box.append(r)})}
function viewInst(x){if(!x.img)return;const o=E('div','mod'),i=E('img'),h=E('div',0,'Tap anywhere to close · this instant disappears');
 o.style.cssText='background:#000;z-index:80';i.src=x.img;i.style.cssText='max-width:96vw;max-height:88vh;border-radius:16px';
 h.style.cssText='position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px';
 o.append(i,h);document.body.append(o);
 o.onclick=()=>{o.remove();const t=now();x.seen=Object.assign({},x.seen,{[me.id]:t});
  const all=(x.to||[]).every(k=>x.seen[k]),up={['seen.'+me.id]:t};if(all){up.img='';x.img=''}
  db.collection('instants').doc(x.id).update(up).catch(()=>{});side()}}
function sendInst(){const f=E('input');f.type='file';f.accept='image/*';
 f.onchange=async()=>{const fl=f.files[0];if(!fl)return;let d;
  try{d=await shrink(fl,900,.65);if(d.length>850000)d=await shrink(fl,650,.55)}catch(e){alert('Could not read that image.');return}pickTo(d)};f.click()}
function pickTo(d){const o=E('div','mod'),s=E('div','sheet glass'),p=E('img','pic'),ul=E('div','pick'),sel=new Set(),ok=E('button','pbtn','Send'),no=E('button','pbtn g','Cancel'),ac=E('div','acts');
 p.src=d;p.style.alignSelf='center';
 Object.keys(U).filter(i=>i!==me.id).forEach(i=>{const r=E('label','pk'),c=E('input');c.type='checkbox';c.onchange=()=>c.checked?sel.add(i):sel.delete(i);r.append(c,av(i),E('span',0,nm(i)));ul.append(r)});
 no.onclick=()=>o.remove();
 ok.onclick=()=>{if(!sel.size)return;const id=now().toString(36)+Math.random().toString(36).slice(2,5),x={uid:me.id,to:[...sel],img:d,ts:now(),seen:{}};
  db.collection('instants').doc(id).set(x).catch(e=>alert('Failed: '+e.message));IN.unshift(Object.assign({id},x));o.remove();side()};
 ac.append(no,ok);s.append(E('h3',0,'Send instant'),p,E('div','l','Disappears after they view it once.'),ul,ac);
 o.append(s);o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o)}
const t0=setInterval(()=>{if(!db)return;clearInterval(t0);
 db.collection('instants').orderBy('ts','desc').limit(60).onSnapshot(s=>{IN=s.docs.map(x=>Object.assign({id:x.id},x.data())).filter(x=>x.uid===me.id||(x.to||[]).includes(me.id));side()},e=>console.warn('instants',e))},300);

/* hook into existing side() */
const os=side;
side=function(){let tot=0;chats().forEach(c=>tot+=c.un);setBg(bM,tot);setBg(bI,unseen().length);
 if(vw==='search')return rs();if(vw==='inst')return ri();
 os();if(unr)$('#chats').querySelectorAll('.ch').forEach(r=>{if(!r.querySelector('.bd'))r.remove()})};
hl();refresh();
})();
</script>
</body></html>
